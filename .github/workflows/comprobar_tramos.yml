name: Comprobar tramos

# Que cada radar de tramo de la DGT (PDF) y de OpenStreetMap esté en los datos publicados, en su sentido.
on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5
      - run: python comprobar_tramos.py datos/radares.json
        timeout-minutes: 60
