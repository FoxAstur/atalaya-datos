name: Vigía de licitaciones

# Una vez al mes: contratos públicos de radares, foto-rojo y foto-stop (TED). Deja datos/LICITACIONES.md.
on:
  schedule:
    - cron: "23 6 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["licitaciones.py", ".github/workflows/licitaciones.yml"]

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  licitaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar
        run: python licitaciones.py
      - name: Publicar
        if: always()
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/LICITACIONES.md cache/licitaciones.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Licitaciones $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
