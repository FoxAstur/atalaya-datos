name: Buscar en OpenStreetMap

# Radares y tramos de control de velocidad que hay en OpenStreetMap dentro de un recuadro (para comprobar a mano).
on:
  workflow_dispatch:
    inputs:
      recuadro:
        description: "sur,oeste,norte,este"
        required: true
        default: "39.42,-0.47,39.51,-0.37"
      relaciones:
        description: "ids de relaciones enforcement para ver sus miembros (separados por comas; opcional)"
        required: false
        default: ""

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass
        continue-on-error: true
        env:
          B: ${{ inputs.recuadro }}
        run: |
          Q="[out:json][timeout:120];(node[\"highway\"=\"speed_camera\"]($B);node[\"enforcement\"]($B);relation[\"type\"=\"enforcement\"]($B);node[\"traffic_sign\"~\"S-?990|R-?301|average|section\",i]($B););out center tags;"
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS --max-time 180 -A "AtalayaRecolector/1.0 (+https://github.com/FoxAstur/atalaya-datos)" --data-urlencode "data=$Q" "$u" -o r.json || true
            if python3 -c "import json;json.load(open('r.json'))" 2>/dev/null; then echo "OK $u"; break; fi
            echo "falla $u:"; head -c 400 r.json; echo; sleep 5
          done
          python3 - <<'PY'
          import json
          d = json.load(open("r.json"))
          for e in d["elements"]:
              t = e.get("tags")
              if not t: continue
              c = e.get("center") or {"lat": e.get("lat"), "lon": e.get("lon")}
              print(e["type"], e["id"], c.get("lat"), c.get("lon"), json.dumps(t, ensure_ascii=False))
              if e["type"] == "relation":
                  print("   miembros:", [(m["role"], m["type"], m["ref"]) for m in e.get("members", [])])
          PY
      - name: Miembros de las relaciones
        continue-on-error: true
        if: inputs.relaciones != ''
        env:
          R: ${{ inputs.relaciones }}
        run: |
          Q="[out:json][timeout:120];relation(id:$R);out body;>;out body qt;"
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass-api.de/api/interpreter; do
            curl -sS --max-time 180 -A "AtalayaRecolector/1.0 (+https://github.com/FoxAstur/atalaya-datos)" --data-urlencode "data=$Q" "$u" -o m.json || true
            if python3 -c "import json;json.load(open('m.json'))" 2>/dev/null; then echo "OK $u"; break; fi
            echo "falla $u"; head -c 300 m.json; echo; sleep 20
          done
          python3 - <<'PY'
          import json
          d = json.load(open("m.json"))
          nodos = {e["id"]: e for e in d["elements"] if e["type"] == "node"}
          vias = {e["id"]: e for e in d["elements"] if e["type"] == "way"}
          for e in d["elements"]:
              if e["type"] != "relation": continue
              print("RELACION", e["id"], json.dumps(e.get("tags"), ensure_ascii=False))
              for m in e["members"]:
                  if m["type"] == "node":
                      n = nodos.get(m["ref"], {})
                      print("  ", m["role"], "nodo", m["ref"], n.get("lat"), n.get("lon"), json.dumps(n.get("tags", {}), ensure_ascii=False))
                  else:
                      w = vias.get(m["ref"], {})
                      ns = w.get("nodes", [])
                      ini = nodos.get(ns[0], {}) if ns else {}
                      fin = nodos.get(ns[-1], {}) if ns else {}
                      print("  ", m["role"], m["type"], m["ref"], json.dumps(w.get("tags", {}), ensure_ascii=False)[:200],
                            "de", ini.get("lat"), ini.get("lon"), "a", fin.get("lat"), fin.get("lon"))
          PY
