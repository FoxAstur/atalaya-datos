name: Muestras de fuentes
# Baja una muestra de fuentes nuevas (para estudiar su formato antes de usarlas). No toca los datos ni falla.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espacios"
        required: true
jobs:
  muestras:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Bajar
        continue-on-error: true
        run: |
          mkdir m; n=0
          for u in ${{ inputs.urls }}; do
            n=$((n+1))
            curl -sS -L -m 120 --compressed -A "atalaya-datos (github.com/FoxAstur)" -o "m/$n.xml" -w "$n $u -> %{http_code} %{size_download} bytes %{content_type}\n" "$u" || echo "$n $u FALLO"
          done
          ls -la m
      - name: A la rama «muestras»
        continue-on-error: true
        run: |
          cd m && git init -q && git checkout -q -b muestras
          git config user.name "atalaya-datos" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "muestras" 
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" muestras
