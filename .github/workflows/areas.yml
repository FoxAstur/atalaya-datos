name: Áreas de descanso

on:
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: areas
  cancel-in-progress: false

jobs:
  areas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5
      - run: python areas.py
      - name: Publicar
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/areas.json
          git diff --cached --quiet || git commit -qm "Áreas de descanso: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
