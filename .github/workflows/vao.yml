name: Carriles BUS-VAO

on:
  schedule:
    - cron: "17 5 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vao
  cancel-in-progress: false

jobs:
  vao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python vao.py
      - name: Publicar
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/vao.json
          git diff --cached --quiet || git commit -qm "Carriles BUS-VAO: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
