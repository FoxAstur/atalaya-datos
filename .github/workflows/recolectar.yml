name: Recolectar radares

on:
  schedule:
    - cron: "17 4 * * *"    # cada día a las 05:17/06:17 hora peninsular
    - cron: "43 15 * * *"   # y por la tarde, por si GitHub se salta la de la mañana
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["recolector.py", "caminos.py", ".github/workflows/recolectar.yml"]

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install pdfplumber==0.11.10

      - name: Red viaria (OpenStreetMap, Geofabrik)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p red
          echo '{"attributes":{"id":false},"linear_tags":true,"area_tags":false,"format_options":{"print_record_separator":false},"include_tags":["highway","ref","name","oneway","junction","maxspeed","maxspeed:forward","maxspeed:backward"]}' > red/export.json
          FILTRO="w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,road"
          : > red/vias.geojsonseq
          for zona in europe/spain africa/canary-islands; do
            f=red/$(basename $zona).osm.pbf
            curl -sSL --retry 3 -o "$f" "https://download.geofabrik.de/${zona}-latest.osm.pbf"
            osmium tags-filter "$f" "$FILTRO" -o red/filtrado.osm.pbf --overwrite
            osmium export red/filtrado.osm.pbf -f geojsonseq --geometry-types=linestring -c red/export.json -o red/parte.geojsonseq --overwrite
            cat red/parte.geojsonseq >> red/vias.geojsonseq
            rm -f "$f" red/filtrado.osm.pbf red/parte.geojsonseq
          done
          ls -la red; wc -l red/vias.geojsonseq

      - name: Recolectar
        run: timeout 100m python recolector.py || echo "::warning::El recolector terminó con aviso; se publica lo obtenido"

      - name: Publicar si hay cambios
        if: always()
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos cache
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
            # si mientras tanto alguien ha subido cambios (p. ej. del código), se integran antes de publicar
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
