name: Hojas de posición (Mapillary)

# Fotos de Mapillary (CC BY-SA 4.0) a lo largo de la carretera de cada punto de posición dudosa, para
# situarlo a ojo. Se dejan como artefacto de la ejecución (no entran en main).
on:
  workflow_dispatch:
    inputs:
      desde: { description: "Primer objetivo (índice)", required: false, default: "0" }
      hasta: { description: "Hasta (sin incluir)", required: false, default: "100000" }
      solo: { description: "Ids separados por espacios (vacío = todos)", required: false, default: "" }

permissions:
  contents: write

concurrency:
  group: posiciones-${{ inputs.desde }}
  cancel-in-progress: false

jobs:
  hojas:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Hojas
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          SOLO: ${{ inputs.solo }}
        run: python posiciones_mapillary.py hojas
      - name: Subir a una rama aparte
        run: |
          mkdir /tmp/s && mv hojas_pos /tmp/s/
          cd /tmp/s
          git init -q -b "hojas-pos-${{ inputs.desde }}"
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          printf 'Fotos de Mapillary (CC BY-SA 4.0, https://www.mapillary.com) para revisión manual.\n' > LEEME.txt
          git add -A && git commit -qm "Hojas de posición"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "hojas-pos-${{ inputs.desde }}"
