name: Mapas propios

# El mapa de Atalaya para usar sin conexión: teselas vectoriales (esquema OpenMapTiles, el mismo que OpenFreeMap, así
# que el estilo de la app vale tal cual) de toda España (península, Baleares, Canarias, Ceuta y Melilla) y Andorra,
# hechas con Planetiler a partir de OpenStreetMap. Un único archivo PMTiles: sin costuras entre comunidades. Se publica como recurso de la publicación «mapas» (dirección fija) y su ficha en datos/mapas.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"   # los lunes de madrugada, con el extracto del domingo de Geofabrik

permissions:
  contents: write

concurrency:
  group: mapas
  cancel-in-progress: false

jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Hacer sitio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /mnt || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Datos de OpenStreetMap (Geofabrik)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
          mkdir -p tmp/osm
          B=https://download.geofabrik.de/europe
          # Geofabrik a veces da 404 un rato mientras renueva sus archivos (de madrugada): se reintenta con calma
          bajar() { for i in 1 2 3 4 5 6; do curl -sSfL --retry 4 -o "$1" "$2" && return 0; echo "reintento $i: $2"; sleep 90; done; return 1; }
          bajar tmp/osm/espana.osm.pbf "$B/spain-latest.osm.pbf"
          bajar tmp/osm/andorra.osm.pbf "$B/andorra-latest.osm.pbf"
          # Canarias: Geofabrik la tiene en África, no dentro de España
          bajar tmp/osm/canarias.osm.pbf "https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf"
          ls -la tmp/osm
          osmium merge tmp/osm/*.osm.pbf -o tmp/espana.osm.pbf --overwrite
          rm -rf tmp/osm
          ls -la tmp/espana.osm.pbf
      - name: Teselas (Planetiler)
        run: |
          curl -sSfL -o tmp/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          # lo nuestro (límites de velocidad y carriles de cada vía): extras.pmtiles
          java -Xmx8g -jar tmp/planetiler.jar generate-custom --schema=mapas/extras.yml --output=tmp/extras.pmtiles \
            --tmpdir=tmp/trabajo --force --maxzoom=14 --nodemap-type=sparsearray --storage=mmap 2>&1 | tail -15
          ls -la tmp/extras.pmtiles
          rm -rf tmp/trabajo
          test -s tmp/extras.pmtiles
          java -Xmx11g -jar tmp/planetiler.jar --osm-path=tmp/espana.osm.pbf --output=tmp/espana.pmtiles \
            --download --download-dir=tmp/fuentes --tmpdir=tmp/trabajo --force \
            --languages=es,ca,eu,gl,ast,en --nodemap-type=sparsearray --storage=mmap 2>&1 | tail -40
          ls -la tmp/espana.pmtiles
          rm -rf tmp/trabajo
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BYTES=$(stat -c %s tmp/espana.pmtiles)
          echo "tamaño: $BYTES"
          # GitHub no admite recursos de más de 2 GiB
          if [ "$BYTES" -ge 2147483648 ]; then echo "Demasiado grande para un recurso de GitHub"; exit 1; fi
          SHA=$(sha256sum tmp/espana.pmtiles | cut -d' ' -f1)
          gh release view mapas >/dev/null 2>&1 || gh release create mapas --title "Mapas de Atalaya" \
            --notes "Teselas vectoriales (OpenMapTiles) para usar Atalaya sin conexión. Datos © colaboradores de OpenStreetMap (ODbL)."
          gh release upload mapas tmp/espana.pmtiles tmp/extras.pmtiles --clobber
          EXTRAS=$(stat -c %s tmp/extras.pmtiles)
          python3 - "$BYTES" "$SHA" "$EXTRAS" <<'EOF'
          import json, sys, datetime
          bytes_, sha, extras = int(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          ficha = {"version": 1, "mapas": [{
              "id": "espana", "nombre": "España (con las islas, Ceuta y Melilla) y Andorra", "bytes": bytes_, "sha256": sha,
              "fecha": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M"),
              "url": "https://github.com/FoxAstur/atalaya-datos/releases/download/mapas/espana.pmtiles",
              # lo que cubre (oeste, sur, este, norte): península y Baleares, Canarias, Ceuta y Melilla; solo se usa dentro
              "zonas": [[-9.6, 35.9, 4.6, 43.9], [-18.4, 27.5, -13.2, 29.6], [-5.45, 35.15, -2.85, 35.95]],
              "atribucion": "© colaboradores de OpenStreetMap",
              # lo nuestro (límites de velocidad de cada vía), aparte: se puede leer por internet o bajar con el mapa
              "extras": {"url": "https://github.com/FoxAstur/atalaya-datos/releases/download/mapas/extras.pmtiles", "bytes": extras},
          }]}
          json.dump(ficha, open("datos/mapas.json", "w"), ensure_ascii=False, indent=1)
          EOF
          cat datos/mapas.json
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/mapas.json
          git commit -qm "Mapas: espana.pmtiles $(date +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
