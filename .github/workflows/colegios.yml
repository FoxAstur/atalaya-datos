name: Colegios

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colegios
  cancel-in-progress: false

jobs:
  colegios:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5
      - run: python -u colegios.py
      - name: Publicar
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/colegios.json
          git diff --cached --quiet || git commit -qm "Colegios: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
