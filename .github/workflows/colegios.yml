name: Colegios y señales

# Colegios y escuelas infantiles de España (OpenStreetMap) para el aviso de zona escolar, y señales y peligros de la
# vía (stops, cedas, semáforos, pasos a nivel, resaltos, animales): del extracto de Geofabrik
# con osmium (Overpass, por regiones, cortaba las respuestas y tardaba horas).
on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colegios
  cancel-in-progress: true

jobs:
  colegios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5
      - name: Extracto de OpenStreetMap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p tmp && : > tmp/colegios.geojsonseq && : > tmp/senales.opl && : > tmp/tranvias.opl && : > tmp/puertos.geojsonseq && : > tmp/peajes.geojsonseq
          # Geofabrik a veces va lento o da error: se reintenta y, si no, el espejo de OpenStreetMap France
          F=https://download.openstreetmap.fr/extracts
          bajar() { d=$1; shift; for i in 1 2 3; do for u in "$@"; do
            curl -sSfL --retry 3 --connect-timeout 30 --speed-limit 300000 --speed-time 60 --max-time 1500 -o "$d" "$u" && osmium fileinfo "$d" >/dev/null 2>&1 && return 0
            echo "reintento $i: $u"; done; sleep 60; done; return 1; }
          for zona in europe/spain africa/canary-islands; do
            f=tmp/$(basename $zona).osm.pbf
            if [ $zona = europe/spain ]; then espejo=$F/europe/spain-latest.osm.pbf; else espejo=$F/africa/spain/canarias-latest.osm.pbf; fi
            bajar "$f" "https://download.geofabrik.de/${zona}-latest.osm.pbf" "$espejo"
            osmium tags-filter "$f" nwr/amenity=school,kindergarten -o tmp/c.osm.pbf --overwrite
            osmium export tmp/c.osm.pbf -f geojsonseq -o tmp/parte.geojsonseq --overwrite
            cat tmp/parte.geojsonseq >> tmp/colegios.geojsonseq
            # stops, cedas el paso, semáforos y peligros de la vía (pasos a nivel, resaltos, animales, desprendimientos, peajes), solo los nodos
            osmium tags-filter "$f" n/highway=stop,give_way,traffic_signals n/railway=level_crossing n/traffic_calming \
              n/hazard n/traffic_sign n/barrier=toll_booth -R -o tmp/s.osm.pbf --overwrite
            osmium cat tmp/s.osm.pbf -f opl -o tmp/s.opl --overwrite
            cat tmp/s.opl >> tmp/senales.opl
            # las vías de tranvía (sus cruces con la calle no son «pasos a nivel» de tren: en ciudad avisaba sin parar)
            osmium tags-filter "$f" w/railway=tram,light_rail -R -o tmp/t.osm.pbf --overwrite
            osmium cat tmp/t.osm.pbf -f opl -o tmp/t.opl --overwrite
            cat tmp/t.opl >> tmp/tranvias.opl
            # puertos de montaña: los nodos mountain_pass de las vías para coches (no los de las sendas)
            osmium tags-filter "$f" w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
              -o tmp/v.osm.pbf --overwrite
            osmium tags-filter tmp/v.osm.pbf n/mountain_pass=yes -R -o tmp/p.osm.pbf --overwrite
            osmium export tmp/p.osm.pbf -f geojsonseq -o tmp/parte.geojsonseq --overwrite
            cat tmp/parte.geojsonseq >> tmp/puertos.geojsonseq
            rm -f tmp/v.osm.pbf
            # las vías de peaje (para saber cuánto cuesta una ruta, con peajes_tarifas.json)
            osmium tags-filter "$f" w/toll=yes -o tmp/pj.osm.pbf --overwrite
            osmium export tmp/pj.osm.pbf -f geojsonseq -o tmp/parte.geojsonseq --overwrite
            cat tmp/parte.geojsonseq >> tmp/peajes.geojsonseq
            rm -f "$f"
          done
          wc -l tmp/colegios.geojsonseq
      - run: python -u colegios.py tmp/colegios.geojsonseq
      - run: python -u senales.py tmp/senales.opl tmp/tranvias.opl
      - run: python -u puertos.py tmp/puertos.geojsonseq
      - run: python -u peajes.py tmp/peajes.geojsonseq
      - name: Publicar
        run: |
          git config user.name "atalaya-bot"
          git config user.email "atalaya-bot@users.noreply.github.com"
          git add datos/colegios.json datos/senales.csv.gz datos/puertos.json datos/peajes.json
          git diff --cached --quiet || git commit -qm "Colegios: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
